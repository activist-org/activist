[project]
name = "backend"
version = "0.0.1"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.27.0",
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "django-ical>=1.9.2",
    "django-tasks-db>=0.12.0",
    "django-stubs>=6.1.0",
    "django-stubs-ext>=6.1.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-camel-case>=1.4.2",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.18.0",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.0.0",
    "icalendar>=7.2.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "i18n-check>=1.21.0",
    "mypy>=2.3.1",
    "numpydoc>=1.10.0",
    "prek>=0.4.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
    "ts-backend-check>=1.6.1",
    "types-icalendar>=6.3.2.20260712",
]
# complexipy is kept out of the default `dev` group because it ships no
# musllinux wheel, so the Alpine dev container would try (and fail) to build it
# from source. Install it explicitly with `--group complexity` where needed.
complexity = [
    # Keep docs dependencies formatted in this way with ruff to allow for upgrades via VS Code extension.
    "complexipy>=7.0.1",
]
audit = [
    # Keep docs dependencies formatted in this way with ruff to allow for upgrades via VS Code extension.
    "pysentry-rs>=0.4.9",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "*/migrations/*.py",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "venv",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
]

ignore = [
    "E501", # line too long, handled by black
]

fixable = ["I"]
unfixable = []

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds the following value.
max-complexity = 10

[tool.isort]
line_length = 88

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = "test_*.py"
addopts = "--nomigrations"
markers = [
    "enable_throttling: Throttling is disabled for all tests unless it's explicitly enabled",
    "filescan_integration: Requires integration with the filescan service",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "asgi.py",
    "wsgi.py",
    "manage.py",
    "*/__init__.py",
    "*/factories.py",
    "*/utils/type_checker/*",
]

[tool.mypy]
mypy_path = "backend"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
exclude = ["^.*/tests/.*\\.py$", "^.*/test_.*\\.py$", "^.*/.*_tests\\.py$"]

[[tool.mypy.overrides]]
module = ["authentication.*", "content.*", "communities.*", "events.*"]
# follow_imports = "skip"  # enable django-stubs
ignore_errors = false

[[tool.mypy.overrides]]
module = ["django_filters.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks, except the below
    "ES01",
    "EX01",
    "SA01",
]

exclude = [
    "^.*\\.Meta$",    # meta classes
    "^.*\\.__str__$", # __str__ methods
    "^__init__$",     # __init__ files
    "^test_.*$",      # test files
    "^views.*$",      # view files
]

[tool.complexipy]
max-complexity-allowed = 10
